apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-payswift-api
  labels:
    app: payswift-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: payswift-api
  template:
    metadata:
      labels:
        app: payswift-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.env.KAFKA_BOOTSTRAP_SERVERS | quote }}
            - name: PAYSWIFT_KAFKA_TOPIC
              value: {{ .Values.env.PAYSWIFT_KAFKA_TOPIC | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
