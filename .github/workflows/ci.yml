name: PaySwift CI (simulation)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -v
        env:
          PYTHONPATH: .

  build-and-scan:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t payswift-api:ci .
      # Report-only by user decision (28 Oct 2026): the remaining bookworm OS
      # findings have no available fix in bookworm, so the scan reports
      # instead of gating — same policy as ShopKart CI.
      - name: Trivy scan (report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: payswift-api:ci
          format: table
          exit-code: "0"
